<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HDMK Inspection Services — Interactive Territory &amp; Service Area Map</title>
  <style>
    :root, [data-theme="dark"] {
      --bg: #0b1120;
      --card: #111827;
      --card-alt: #1e293b;
      --border: #283548;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --primary: #dc2626;
      --primary-fg: #ffffff;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #ef4444;
    }
    [data-theme="light"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-alt: #f8fafc;
      --border: #cbd5e1;
      --fg: #0f172a;
      --muted: #475569;
      --primary: #dc2626;
      --primary-fg: #ffffff;
      --emerald: #059669;
      --amber: #d97706;
      --rose: #dc2626;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0; padding: 0; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg); color: var(--fg);
      user-select: none; -webkit-font-smoothing: antialiased;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .topbar {
      padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; letter-spacing: 0.02em; }
    .brand-badge {
      background: var(--primary); color: #fff; padding: 3px 8px; border-radius: 5px; font-size: 12px; font-weight: 800;
    }
    .subbar {
      padding: 7px 14px; background: var(--bg); border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px;
    }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    button, select, input[type="text"] {
      font-family: inherit; font-size: 12px; color: var(--fg);
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 10px; outline: none; transition: all 0.12s ease;
    }
    button { cursor: pointer; font-weight: 600; }
    button:hover { background: var(--card-alt); }
    button.active, button.primary {
      background: var(--primary); color: var(--primary-fg); border-color: var(--primary);
    }
    button.mode-pill.active {
      background: #2563eb; color: #fff; border-color: #2563eb;
    }
    .search-wrap { position: relative; }
    .search-wrap input { width: 220px; padding-left: 10px; background: var(--bg); }
    .search-results {
      position: absolute; top: 34px; left: 0; width: 280px; max-height: 240px; overflow-y: auto;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35); z-index: 60; display: none;
    }
    .search-item {
      padding: 7px 10px; font-size: 12px; border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .search-item:hover { background: var(--card-alt); }
    .main { flex: 1; display: flex; min-height: 0; position: relative; }
    .map-wrap { flex: 1; position: relative; min-width: 0; }
    canvas { display: block; cursor: grab; touch-action: none; -webkit-tap-highlight-color: transparent; }
    canvas:active { cursor: grabbing; }
    .zoom-box {
      position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 4px;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px;
    }
    .zoom-box button { width: 30px; height: 28px; padding: 0; text-align: center; }
    .legend {
      position: absolute; bottom: 12px; left: 12px; background: var(--card); opacity: 0.95;
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12px;
      max-width: 410px; pointer-events: none; line-height: 1.45;
    }
    .tooltip {
      position: fixed; z-index: 80; pointer-events: none; display: none;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 12px; font-size: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.35); max-width: 300px;
    }
    .sidebar {
      width: 370px; border-left: 1px solid var(--border); background: var(--card);
      display: flex; flex-direction: column; min-height: 0; flex-shrink: 0;
    }
    .side-hdr { padding: 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
    .side-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
    .county-card {
      padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg);
      display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; cursor: pointer;
    }
    .county-card:hover { background: var(--card-alt); }
    .county-card.cut { opacity: 0.52; border-style: dashed; }
    .county-card.outlier { border-color: var(--rose); }
    .dot { width: 9px; height: 9px; border-radius: 999px; display: inline-block; flex-shrink: 0; }
    .chk-lbl { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--muted); font-size: 12px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
    @media (max-width: 900px) {
      .topbar { padding: 8px 10px; gap: 6px; }
      .subbar { padding: 6px 10px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
      .subbar .row { flex-wrap: nowrap; white-space: nowrap; }
      #region-pills { overflow-x: auto; flex-wrap: nowrap; max-width: 100vw; padding-bottom: 2px; }
      #region-pills button { white-space: nowrap; flex-shrink: 0; }
      .search-wrap input { width: 170px; font-size: 14px; }
      .sidebar { width: 100%; height: 36%; border-left: none; border-top: 1px solid var(--border); }
      .main { flex-direction: column; }
      .legend { display: none; }
      .tooltip { left: 10px !important; right: 10px !important; top: auto !important; bottom: 38% !important; max-width: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="row">
        <div class="brand">
          <span class="brand-badge">HDMK</span>
          <span>Service Territory Explorer</span>
        </div>
        <div class="search-wrap">
          <input type="text" id="zip-search" placeholder="Check ZIP or City (e.g. 32801, Tampa)..." autocomplete="off" />
          <div class="search-results" id="search-results"></div>
        </div>
        <div class="row" id="region-pills"></div>
      </div>

      <div class="row">
        <button id="btn-mode-client" class="mode-pill">Website Preview</button>
        <button id="btn-mode-admin" class="mode-pill active">Admin Planning</button>
        <button id="btn-theme">Light / Dark</button>
      </div>
    </div>

    <div class="subbar">
      <div class="row" id="terr-pills"></div>
      <div class="row" id="admin-controls">
        <label class="chk-lbl"><input type="checkbox" id="chk-rings" checked /> 45m / 60m Rings</label>
        <label class="chk-lbl"><input type="checkbox" id="chk-outliers" checked /> Flag &gt;45m</label>
        <label class="chk-lbl"><input type="checkbox" id="chk-zips" checked /> ZIP Dots</label>
        <label class="chk-lbl"><input type="checkbox" id="chk-labels" checked /> Cities &amp; Hwys</label>
        <button id="btn-autotrim">Trim &gt;45m</button>
        <button id="btn-reset">Reset (110)</button>
        <button id="btn-copy" class="primary">Copy Keep/Cut List</button>
      </div>
    </div>

    <div class="main">
      <div class="map-wrap" id="map-wrap">
        <canvas id="map-canvas"></canvas>
        <div class="zoom-box">
          <button id="btn-zin" title="Zoom In">+</button>
          <button id="btn-zout" title="Zoom Out">&minus;</button>
          <button id="btn-zfit" title="Fit View" style="font-size:11px;">Fit</button>
        </div>
        <div class="legend" id="legend-box"></div>
        <div class="tooltip" id="tooltip"></div>
      </div>

      <div class="sidebar">
        <div class="side-hdr" id="sidebar-header"></div>
        <div class="side-list" id="county-list"></div>
      </div>
    </div>
  </div>

      const cs = DATA.counties.filter(c => (countyState[c.id].tid || countyState[c.id].origTid) === tid);
      if (!cs.length) return;
      let minLon = 999, minLat = 999, maxLon = -999, maxLat = -999;
      cs.forEach(c => c.p.forEach(ring => ring.forEach(([lon, lat]) => {
        if (lon < minLon) minLon = lon; if (lon > maxLon) maxLon = lon;
        if (lat < minLat) minLat = lat; if (lat > maxLat) maxLat = lat;
      })));
      const hub = TERRITORIES[tid].hubs[hubIndex[tid]];
      minLon = Math.min(minLon, hub.lon - 0.7); maxLon = Math.max(maxLon, hub.lon + 0.7);
      minLat = Math.min(minLat, hub.lat - 0.6); maxLat = Math.max(maxLat, hub.lat + 0.6);
      fitBBox([minLon, minLat, maxLon, maxLat]);
    }

    function proj(lon, lat) {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      return [w / 2 + (lon - view.cx) * view.cosLat * view.scale, h / 2 - (lat - view.cy) * view.scale];
    }

    function unproj(x, y) {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      return [view.cx + (x - w / 2) / (view.cosLat * view.scale), view.cy - (y - h / 2) / view.scale];
    }

    function hexToRgba(hex, a) {
      const n = parseInt(hex.slice(1), 16);
      return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
    }

    function visibleTerritories() {
      if (activeTerr) return new Set([activeTerr]);
      const r = REGIONS.find(x => x.id === activeView) || REGIONS[0];
      return new Set(r.terrs);
    }

    function updateLegend() {
      const box = document.getElementById('legend-box');
      if (appMode === 'client') {
        box.innerHTML = `<strong>HDMK Service Coverage Map</strong><br/>Type your 5-digit ZIP code or city above, or click any shaded county/parish to view local services &amp; contact details.`;
      } else {
        box.innerHTML = `<strong>Admin Planning Guide</strong><br/>&bull; <span style="color:var(--emerald);font-weight:700;">Green ring</span> = ~45m drive (~35 mi) &middot; <span style="color:var(--amber);font-weight:700;">Amber ring</span> = ~60m (~45 mi)<br/>&bull; <span style="color:var(--rose);font-weight:700;">Red border</span> = Avg &gt;45m drive from hub &middot; <strong>Click county</strong> to Keep / Cut.`;
      }
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (!w || !h) return;
      if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      ctx.fillStyle = isLight ? '#e2e8f0' : '#0b1120';
      ctx.fillRect(0, 0, w, h);

      DATA.states.forEach(st => {
        ctx.beginPath();
        st.p.forEach(ring => {
          ring.forEach(([lon, lat], i) => { const [x, y] = proj(lon, lat); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
          ctx.closePath();
        });
        ctx.fillStyle = isLight ? '#ffffff' : '#131c2e';
        ctx.fill();
      });

      const vis = visibleTerritories();
      const flagOutliers = appMode === 'admin' && document.getElementById('chk-outliers').checked;

      DATA.counties.forEach(c => {
        const st = countyState[c.id];
        const tid = st.tid, origTid = st.origTid;
        ctx.beginPath();
        c.p.forEach(ring => {
          ring.forEach(([lon, lat], i) => { const [x, y] = proj(lon, lat); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
          ctx.closePath();
        });
        if (tid) {
          const tColor = TERRITORIES[tid].color;
          const dim = !vis.has(tid);
          const stats = countyStats(c, tid);
          const isOut = flagOutliers && stats.avgMi > OUTLIER_MI;
          ctx.fillStyle = hexToRgba(tColor, dim ? 0.14 : (isOut ? 0.30 : 0.48));
          ctx.fill();
          ctx.strokeStyle = isOut && !dim ? '#ef4444' : hexToRgba(tColor, dim ? 0.28 : 0.88);
          ctx.lineWidth = isOut && !dim ? 1.8 : 0.9;
          ctx.stroke();
        } else if (origTid && appMode === 'admin') {
          ctx.fillStyle = isLight ? 'rgba(148,163,184,0.22)' : 'rgba(100,116,139,0.22)';
          ctx.fill();
          ctx.setLineDash([3, 3]);
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.setLineDash([]);
        } else {
          ctx.strokeStyle = isLight ? '#e2e8f0' : '#1e293b';
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      });

      if (hoveredCounty) {
        ctx.beginPath();
        hoveredCounty.p.forEach(ring => {
          ring.forEach(([lon, lat], i) => { const [x, y] = proj(lon, lat); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
          ctx.closePath();
        });
        ctx.strokeStyle = isLight ? '#0f172a' : '#f8fafc';
        ctx.lineWidth = 2.2;
        ctx.stroke();
      }

      DATA.states.forEach(st => {
        ctx.beginPath();
        st.p.forEach(ring => {
          ring.forEach(([lon, lat], i) => { const [x, y] = proj(lon, lat); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
          ctx.closePath();
        });
        ctx.strokeStyle = isLight ? '#94a3b8' : '#475569';
        ctx.lineWidth = 1.3;
        ctx.stroke();
      });

      if (appMode === 'client' || document.getElementById('chk-labels').checked) {
        ctx.strokeStyle = isLight ? 'rgba(71,85,105,0.34)' : 'rgba(148,163,184,0.28)';
        ctx.lineWidth = 1.5;
        HIGHWAYS.forEach(hw => {
          ctx.beginPath();
          hw.pts.forEach(([lon, lat], i) => { const [x, y] = proj(lon, lat); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
          ctx.stroke();
        });
      }

      if (appMode === 'admin' && document.getElementById('chk-zips').checked) {
        const r = view.scale > 130 ? 2.3 : 1.5;
        DATA.zips.forEach(z => {
          if (!vis.has(z[2]) && activeTerr) return;
          const [x, y] = proj(z[0], z[1]);
          if (x < -4 || x > w + 4 || y < -4 || y > h + 4) return;
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = isLight ? 'rgba(15,23,42,0.5)' : 'rgba(248,250,252,0.6)';
          ctx.fill();
        });
      }

      if (appMode === 'admin' && document.getElementById('chk-rings').checked) {
        Object.entries(TERRITORIES).forEach(([tid, t]) => {
          if (!vis.has(tid)) return;
          const hub = t.hubs[hubIndex[tid]];
          const [hx, hy] = proj(hub.lon, hub.lat);
          const r35 = (35 / 69.0) * view.scale, r45 = (45 / 69.0) * view.scale;
          ctx.save();
          ctx.setLineDash([5, 4]);
          ctx.beginPath(); ctx.arc(hx, hy, r45, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(245,158,11,0.75)'; ctx.lineWidth = 1.4; ctx.stroke();
          ctx.setLineDash([6, 3]);
          ctx.beginPath(); ctx.arc(hx, hy, r35, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(16,185,129,0.95)'; ctx.lineWidth = 2.0; ctx.stroke();
          ctx.restore();
          ctx.beginPath(); ctx.arc(hx, hy, 5.5, 0, Math.PI * 2);
          ctx.fillStyle = '#10b981'; ctx.fill();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.stroke();
        });
      }

      if (pinnedZip) {
        const [px, py] = proj(pinnedZip[0], pinnedZip[1]);
        ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#dc2626'; ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
      }

      if (appMode === 'client' || document.getElementById('chk-labels').checked) {
        ctx.textAlign = 'center';
        CITIES.forEach(([name, lon, lat]) => {
          const [x, y] = proj(lon, lat);
          if (x < 25 || x > w - 25 || y < 18 || y > h - 18) return;
          ctx.font = '700 11px sans-serif';
          ctx.strokeStyle = isLight ? 'rgba(255,255,255,0.9)' : 'rgba(11,17,32,0.9)';
          ctx.lineWidth = 3;
          ctx.strokeText(name, x, y - 6);
          ctx.fillStyle = isLight ? '#0f172a' : '#f8fafc';
          ctx.fillText(name, x, y - 6);
        });
        ctx.textAlign = 'left';
      }
    }

    function pointInRing(lon, lat, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
        if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / ((yj - yi) || 1e-9) + xi)) inside = !inside;
      }
      return inside;
    }

    function hitCounty(lon, lat) {
      for (const c of DATA.counties) {
        for (const ring of c.p) if (pointInRing(lon, lat, ring)) return c;
      }
      return null;
    }

    let dragging = false, moved = false, startX = 0, startY = 0, startCx = 0, startCy = 0, hoveredCounty = null;
    const tooltip = document.getElementById('tooltip');

    canvas.addEventListener('mousedown', e => {
      dragging = true; moved = false; startX = e.clientX; startY = e.clientY; startCx = view.cx; startCy = view.cy;
    });

    window.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      if (dragging) {
        const dx = e.clientX - startX, dy = e.clientY - startY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
        view.cx = startCx - dx / (view.cosLat * view.scale);
        view.cy = startCy + dy / view.scale;
        draw();
        return;
      }
      if (x < 0 || y < 0 || x > rect.width || y > rect.height) {
        hoveredCounty = null; tooltip.style.display = 'none'; draw(); return;
      }
      const [lon, lat] = unproj(x, y);
      const hit = hitCounty(lon, lat);
      if (hit !== hoveredCounty) { hoveredCounty = hit; draw(); }
      if (hit) {
        const st = countyState[hit.id];
        const tid = st.tid || (appMode === 'admin' ? st.origTid : null);
        let html = `<div style="font-weight:700;font-size:13px;">${hit.n} ${hit.s === 'LA' ? 'Parish' : 'County'}, ${hit.s}</div>`;
        if (tid) {
          const t = TERRITORIES[tid];
          if (appMode === 'client') {
            html += `<div style="margin-top:4px;color:var(--emerald);font-weight:700;">Served by HDMK ${t.name}</div>`;
            html += `<div style="margin-top:3px;color:var(--muted);">${t.publicSummary}</div>`;
            html += `<div style="margin-top:5px;font-weight:700;">Call: ${t.publicPhone}</div>`;
          } else {
            const stats = countyStats(hit, tid);
            html += `<div style="margin-top:3px;">Branch: <strong>${t.name}</strong> &middot; <strong>${st.tid ? 'KEEP' : 'CUT'}</strong></div>`;
            html += `<div style="color:var(--muted);margin-top:2px;">~${stats.estMin}m drive (${stats.avgMi.toFixed(0)} mi avg) &middot; ${hit.z || '?'} ZIPs</div>`;
            html += `<div style="color:var(--muted);font-size:11px;">Click to ${st.tid ? 'CUT' : 'KEEP'}</div>`;
          }
        } else {
          html += `<div style="color:var(--muted);margin-top:3px;">Outside active territory coverage</div>`;
        }
        tooltip.innerHTML = html;
        tooltip.style.left = Math.min(window.innerWidth - 310, e.clientX + 14) + 'px';
        tooltip.style.top = Math.min(window.innerHeight - 150, e.clientY + 14) + 'px';
        tooltip.style.display = 'block';
      } else {
        tooltip.style.display = 'none';
      }
    });

    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      if (!moved && hoveredCounty) {
        if (appMode === 'client') {
          const tid = countyState[hoveredCounty.id].tid;
          if (tid) { activeTerr = tid; renderPills(); renderSidebar(); fitTerritory(tid); }
        } else {
          const st = countyState[hoveredCounty.id];
          if (st.origTid) st.tid = st.tid ? null : st.origTid;
          else if (st.tid) st.tid = null;
          else if (activeTerr && TERRITORIES[activeTerr].state === hoveredCounty.s) st.tid = activeTerr;
          renderPills(); renderSidebar(); draw();
        }
      }
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const [lonB, latB] = unproj(mx, my);
      view.scale = Math.max(20, Math.min(1200, view.scale * (e.deltaY < 0 ? 1.22 : 1 / 1.22)));
      const [lonA, latA] = unproj(mx, my);
      view.cx += (lonB - lonA); view.cy += (latB - latA);
      draw();
    }, { passive: false });

    // Mobile Touch Support: 1-finger pan, 2-finger pinch-zoom, single-tap county inspect/toggle
    let tMode = null, tMoved = false, tStartX = 0, tStartY = 0, tStartCx = 0, tStartCy = 0;
    let pinchDist0 = 0, pinchScale0 = 1, pinchLon0 = 0, pinchLat0 = 0;

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      if (e.touches.length === 1) {
        tMode = 'pan'; tMoved = false;
        tStartX = e.touches[0].clientX; tStartY = e.touches[0].clientY;
        tStartCx = view.cx; tStartCy = view.cy;
      } else if (e.touches.length === 2) {
        tMode = 'pinch'; tMoved = true;
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        pinchDist0 = Math.hypot(dx, dy) || 1;
        pinchScale0 = view.scale;
        const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
        const my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
        [pinchLon0, pinchLat0] = unproj(mx, my);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      if (tMode === 'pan' && e.touches.length === 1) {
        const dx = e.touches[0].clientX - tStartX;
        const dy = e.touches[0].clientY - tStartY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) tMoved = true;
        view.cx = tStartCx - dx / (view.cosLat * view.scale);
        view.cy = tStartCy + dy / view.scale;
        draw();
      } else if (e.touches.length === 2) {
        tMode = 'pinch'; tMoved = true;
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        const dist = Math.hypot(dx, dy) || 1;
        view.scale = Math.max(20, Math.min(1200, pinchScale0 * (dist / pinchDist0)));
        const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
        const my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
        const [lonA, latA] = unproj(mx, my);
        view.cx += (pinchLon0 - lonA);
        view.cy += (pinchLat0 - latA);
        draw();
      }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      if (tMode === 'pan' && !tMoved && e.changedTouches.length === 1) {
        const rect = canvas.getBoundingClientRect();
        const x = e.changedTouches[0].clientX - rect.left;
        const y = e.changedTouches[0].clientY - rect.top;
        const [lon, lat] = unproj(x, y);
        const hit = hitCounty(lon, lat);
        hoveredCounty = hit;
        if (hit) {
          const st = countyState[hit.id];
          const tid = st.tid || (appMode === 'admin' ? st.origTid : null);
          if (appMode === 'client' && tid) {
            activeTerr = tid; renderPills(); renderSidebar();
          } else if (appMode === 'admin') {
            if (st.origTid) st.tid = st.tid ? null : st.origTid;
            else if (st.tid) st.tid = null;
            else if (activeTerr && TERRITORIES[activeTerr].state === hit.s) st.tid = activeTerr;
            renderPills(); renderSidebar();
          }
          if (tid) {
            const t = TERRITORIES[tid];
            const stats = countyStats(hit, tid);
            tooltip.innerHTML = `<div style="font-weight:700;">${hit.n} ${hit.s === 'LA' ? 'Parish' : 'County'}, ${hit.s} &mdash; ${t.name}</div>` +
              (appMode === 'client'
                ? `<div style="color:var(--muted);margin-top:2px;">${t.publicSummary}</div>`
                : `<div style="color:var(--muted);margin-top:2px;">~${stats.estMin}m drive (${stats.avgMi.toFixed(0)} mi) &middot; Status: <strong>${st.tid ? 'KEEP' : 'CUT'}</strong></div>`);
            tooltip.style.display = 'block';
            setTimeout(() => { tooltip.style.display = 'none'; }, 3500);
          }
        } else {
          tooltip.style.display = 'none';
        }
        draw();
      }
      if (e.touches.length === 0) tMode = null;
    }, { passive: false });

    // ZIP / City Search
    const sInput = document.getElementById('zip-search');
    const sRes = document.getElementById('search-results');
    sInput.addEventListener('input', () => {
      const q = sInput.value.trim().toLowerCase();
      if (q.length < 2) { sRes.style.display = 'none'; return; }
      const matches = [];
      for (const z of DATA.zips) {
        if (z[3].startsWith(q) || z[4].toLowerCase().includes(q)) {
          matches.push(z);
          if (matches.length >= 12) break;
        }
      }
      if (!matches.length) {
        sRes.innerHTML = `<div class="search-item" style="color:var(--muted);">No covered ZIP/City matching "${q}"</div>`;
      } else {
        sRes.innerHTML = matches.map((z, idx) => `<div class="search-item" data-idx="${idx}"><strong>${z[3]}</strong> &mdash; ${z[4]}, ${TERRITORIES[z[2]].state} <span style="color:var(--emerald);float:right;font-weight:700;">${TERRITORIES[z[2]].name}</span></div>`).join('');
        sRes.querySelectorAll('.search-item').forEach((el, idx) => {
          el.onclick = () => {
            const z = matches[idx];
            pinnedZip = z;
            activeTerr = z[2];
            sRes.style.display = 'none';
            sInput.value = `${z[3]} — ${z[4]}`;
            renderPills(); renderSidebar();
            view.cx = z[0]; view.cy = z[1]; view.cosLat = Math.cos(z[1]*Math.PI/180); view.scale = 180;
            draw();
          };
        });
      }
      sRes.style.display = 'block';
    });

    function renderPills() {
      const rp = document.getElementById('region-pills');
      rp.innerHTML = '';
      REGIONS.forEach(r => {
        const b = document.createElement('button');
        if (!activeTerr && activeView === r.id) b.className = 'active';
        b.textContent = r.label;
        b.onclick = () => { pinnedZip = null; activeTerr = null; activeView = r.id; renderPills(); renderSidebar(); fitBBox(r.bbox); };
        rp.appendChild(b);
      });

      const tp = document.getElementById('terr-pills');
      tp.innerHTML = '<span style="color:var(--muted);font-weight:600;">Branches:</span>';
      Object.entries(TERRITORIES).forEach(([tid, t]) => {
        const cs = DATA.counties.filter(c => countyState[c.id].tid === tid);
        const b = document.createElement('button');
        if (activeTerr === tid) b.className = 'active';
        b.innerHTML = `<span class="dot" style="background:${t.color};margin-right:5px;"></span>${t.name} (${cs.length})`;
        b.onclick = () => { pinnedZip = null; activeTerr = tid; renderPills(); renderSidebar(); fitTerritory(tid); };
        tp.appendChild(b);
      });
    }

    function renderSidebar() {
      const hdr = document.getElementById('sidebar-header');
      const list = document.getElementById('county-list');
      const vis = visibleTerritories();
      const relevant = DATA.counties.filter(c => {
        const st = countyState[c.id];
        const t = st.tid || (appMode === 'admin' ? st.origTid : null);
        return t && vis.has(t);
      });

      if (appMode === 'client') {
        if (activeTerr) {
          const t = TERRITORIES[activeTerr];
          hdr.innerHTML = `<div style="font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;"><span class="dot" style="background:${t.color}"></span>HDMK ${t.name} (${t.state})</div>
            <div style="margin-top:6px;color:var(--muted);line-height:1.45;">${t.publicSummary}</div>
            <div style="margin-top:8px;font-weight:700;">Schedule / Questions: ${t.publicPhone}</div>`;
        } else {
          hdr.innerHTML = `<div style="font-size:14px;font-weight:800;">HDMK Regional Branches</div>
            <div style="margin-top:4px;color:var(--muted);">Select a branch above or search your 5-digit ZIP code to view covered counties, parishes, and local inspection services.</div>`;
        }
        list.innerHTML = '';
        relevant.filter(c => countyState[c.id].tid).sort((a, b) => a.n.localeCompare(b.n)).forEach(c => {
          const tid = countyState[c.id].tid;
          const d = document.createElement('div');
          d.className = 'county-card';
          d.innerHTML = `<div><strong>${c.n} ${c.s === 'LA' ? 'Parish' : 'County'}, ${c.s}</strong><div style="font-size:11px;color:var(--muted);">${(c.ci||[]).slice(0,4).join(', ')}</div></div><span style="font-weight:700;color:var(--emerald);">${TERRITORIES[tid].name}</span>`;
          d.onclick = () => { activeTerr = tid; renderPills(); renderSidebar(); fitTerritory(tid); };
          list.appendChild(d);
        });
        return;
      }

      let kept = 0, cut = 0, zips = 0, outs = 0;
      relevant.forEach(c => {
        const st = countyState[c.id];
        if (st.tid) { kept++; zips += (c.z || 0); if (countyStats(c, st.tid).avgMi > OUTLIER_MI) outs++; }
        else cut++;
      });

      if (activeTerr) {
        const t = TERRITORIES[activeTerr];
        const opts = t.hubs.map((h, i) => `<option value="${i}" ${i===hubIndex[activeTerr]?'selected':''}>${h.label}</option>`).join('');
        hdr.innerHTML = `<div style="font-size:14px;font-weight:800;display:flex;justify-content:space-between;"><span>${t.name} (${t.state})</span><span style="color:var(--muted);font-weight:600;">${kept} kept &middot; ${zips} ZIPs</span></div>
          <div style="color:var(--muted);margin-top:4px;">${t.officeNote}</div>
          <div style="margin-top:8px;display:flex;align-items:center;gap:6px;"><span>Hub:</span><select id="sel-hub" style="flex:1;">${opts}</select></div>`;
        hdr.querySelector('#sel-hub').onchange = e => { hubIndex[activeTerr] = +e.target.value; renderPills(); renderSidebar(); draw(); };
      } else {
        hdr.innerHTML = `<div style="font-size:14px;font-weight:800;">Coverage &amp; 45-Min Drive Audit</div>
          <div class="stat-grid">
            <div class="stat-box"><div style="color:var(--muted);">Kept</div><strong>${kept} co / ${zips} zip</strong></div>
            <div class="stat-box"><div style="color:var(--muted);">&gt;45m</div><strong style="color:var(--rose);">${outs} co</strong></div>
            <div class="stat-box"><div style="color:var(--muted);">Cut</div><strong style="color:var(--amber);">${cut} co</strong></div>
          </div>`;
      }

      list.innerHTML = '';
      relevant.map(c => {
        const st = countyState[c.id], tid = st.tid || st.origTid;
        return { c, st, tid, stats: countyStats(c, tid) };
      }).sort((a, b) => b.stats.avgMi - a.stats.avgMi).forEach(({ c, st, tid, stats }) => {
        const isKept = !!st.tid, isOut = stats.avgMi > OUTLIER_MI;
        const d = document.createElement('div');
        d.className = 'county-card' + (!isKept ? ' cut' : (isOut ? ' outlier' : ''));
        d.innerHTML = `<div style="min-width:0;"><div style="font-weight:700;"><span class="dot" style="background:${TERRITORIES[tid].color};margin-right:5px;"></span>${c.n}, ${c.s} ${!activeTerr ? `&middot; <span style="font-weight:400;color:var(--muted);">${TERRITORIES[tid].name}</span>` : ''}</div>
          <div style="font-size:11px;color:var(--muted);">${c.z||'?'} ZIPs &middot; ${(c.ci||[]).slice(0,3).join(', ')}</div></div>
          <div style="text-align:right;flex-shrink:0;"><div style="font-weight:700;${isOut&&isKept?'color:var(--rose);':''}">~${stats.estMin}m (${stats.avgMi.toFixed(0)}mi)</div>
          <div style="font-size:11px;font-weight:700;color:${isKept?'var(--emerald)':'var(--amber)'};">${isKept?'KEEP':'CUT'}</div></div>`;
        d.onclick = () => {
          if (st.origTid) st.tid = st.tid ? null : st.origTid; else st.tid = null;
          renderPills(); renderSidebar(); draw();
        };
        list.appendChild(d);
      });
    }

    document.getElementById('btn-mode-client').onclick = () => {
      appMode = 'client';
      document.getElementById('btn-mode-client').classList.add('active');
      document.getElementById('btn-mode-admin').classList.remove('active');
      document.getElementById('admin-controls').style.display = 'none';
      updateLegend(); renderSidebar(); draw();
    };
    document.getElementById('btn-mode-admin').onclick = () => {
      appMode = 'admin';
      document.getElementById('btn-mode-admin').classList.add('active');
      document.getElementById('btn-mode-client').classList.remove('active');
      document.getElementById('admin-controls').style.display = 'flex';
      updateLegend(); renderSidebar(); draw();
    };
    document.getElementById('btn-theme').onclick = () => {
      const cur = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', cur === 'light' ? 'dark' : 'light');
      draw();
    };

    ['chk-rings', 'chk-outliers', 'chk-zips', 'chk-labels'].forEach(id => document.getElementById(id).onchange = draw);
    document.getElementById('btn-zin').onclick = () => { view.scale = Math.min(1200, view.scale * 1.35); draw(); };
    document.getElementById('btn-zout').onclick = () => { view.scale = Math.max(20, view.scale / 1.35); draw(); };
    document.getElementById('btn-zfit').onclick = () => { if (activeTerr) fitTerritory(activeTerr); else fitBBox((REGIONS.find(x => x.id === activeView) || REGIONS[0]).bbox); };
    document.getElementById('btn-autotrim').onclick = () => {
      DATA.counties.forEach(c => { const st = countyState[c.id], tid = st.tid || st.origTid; if (tid && countyStats(c, tid).avgMi > OUTLIER_MI) st.tid = null; });
      renderPills(); renderSidebar(); draw();
    };
    document.getElementById('btn-reset').onclick = () => {
      DATA.counties.forEach(c => { countyState[c.id].tid = countyState[c.id].origTid; });
      renderPills(); renderSidebar(); draw();
    };
    document.getElementById('btn-copy').onclick = async () => {
      const lines = ['HDMK Territory County/Parish Decisions:'];
      Object.entries(TERRITORIES).forEach(([tid, t]) => {
        const cut = DATA.counties.filter(c => countyState[c.id].origTid === tid && !countyState[c.id].tid).map(c => c.n);
        const added = DATA.counties.filter(c => !countyState[c.id].origTid && countyState[c.id].tid === tid).map(c => c.n);
        const kept = DATA.counties.filter(c => countyState[c.id].tid === tid).map(c => c.n);
        if (cut.length || added.length) lines.push(`- ${tid} (${t.name}): KEEP [${kept.join(', ')}]${cut.length ? ` | CUT [${cut.join(', ')}]` : ''}${added.length ? ` | ADD [${added.join(', ')}]` : ''}`);
        else lines.push(`- ${tid} (${t.name}): unchanged (${kept.length})`);
      });
      try { await navigator.clipboard.writeText(lines.join('\n')); const b = document.getElementById('btn-copy'); b.textContent = 'Copied!'; setTimeout(() => b.textContent = 'Copy Keep/Cut List', 1800); }
      catch (_) { prompt('Copy list:', lines.join('\n')); }
    };

    window.addEventListener('resize', draw);
    updateLegend(); renderPills(); renderSidebar();
    setTimeout(() => fitBBox(REGIONS[0].bbox), 30);
  </script>
</body>
</html>
